<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>連線中 ｜ 無音</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230a0d0f%27/%3E%3Crect x=%274%27 y=%274%27 width=%278%27 height=%278%27 fill=%27none%27 stroke=%27%233fbfae%27 stroke-width=%272%27/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/game.css">
</head>
<body class="game">

    <!-- 右上角：聲音開關、離開（遊戲中不顯示網站導覽列） -->
    <div class="game-controls">
        <button type="button" class="sound-toggle" aria-pressed="false" aria-label="開啟聲音">
            <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="sound-label mono">聲音 關</span>
        </button>
        <a href="index.html" class="exit-link mono small">中斷連線 ✕</a>
    </div>

    <!-- 階段一：終端機 -->
    <main class="terminal" id="terminal" aria-live="polite">
        <div class="term-output" id="term-output"></div>
        <!-- 輸入密碼的那一行（用真的 input，手機也能叫出鍵盤） -->
        <label class="term-input-line" id="term-input-line" hidden>
            <span class="term-prompt">請輸入密碼：</span>
            <input type="password" id="term-input" class="term-input" autocomplete="off" spellcheck="false" aria-label="密碼">
            <span class="term-mask" id="term-mask" aria-hidden="true"></span><span class="term-cursor" aria-hidden="true"></span>
        </label>
        <p class="term-hint mono small" id="term-hint">點擊畫面可加速</p>
    </main>

    <!-- 電視開機的十字白光（點陣） -->
    <canvas class="crt" id="crt" aria-hidden="true"></canvas>

    <!-- 階段三：偷懶員工的桌面 -->
    <section class="desktop" id="desktop" hidden aria-label="基地工作站桌面">
        <div class="wallpaper" aria-hidden="true">
            <p class="wall-logo mono">IDOA</p>
            <p class="wall-sub mono small">INTERNATIONAL DEEP-OCEAN AGENCY ／ MUON STATION</p>
        </div>

        <!-- 桌面圖示：由 game.js 產生 -->
        <div class="icons" id="icons"></div>

        <!-- 視窗會放在這裡 -->
        <div class="windows" id="windows"></div>

        <!-- 工作列 -->
        <footer class="taskbar">
            <button type="button" class="start-btn mono">▣ MUON</button>
            <span class="task-user small">使用者：<span id="task-user">maint_07</span></span>
            <div class="task-windows" id="task-windows"></div>
            <span class="task-right mono small">
                <span>網路 ▂▄▁▁</span>
                <span>電力 <span class="warn-text">12%</span></span>
                <span id="task-clock">--:--</span>
            </span>
        </footer>
    </section>

    <script src="assets/js/audio.js"></script>
    <script src="assets/js/game.js"></script>
</body>
</html>
